<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
                <h1>
                    <img class="odin-logo" src="odin-lined.png">
                    ODIN
                </h1>
            <img class="sidebar-img" src="halie-west-25xggax4bSA-unsplash.jpg">
        </div>
    </div>
   

    <div class="main">
        <div class="intro">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
            <p>Sign up now to get started!</p>

            <p>You know you want to.</p>
        </div>
        <form>
            <h2>Let's Do This!</h2>
            <div class="name">
                <label for="first-name">First Name:
                <input type="text" id="first-name" name="first-name">
                </label>

                <label for="last-name">Last Name:
                <input type="text" id="last-name" name="last-name">
                </label>
            </div>

            <div class="contact">
                <label for="e-mail">E-mail:
                <input type="email" id="e-mail" name="e-mail">
                </label>

                <label for="phone">Phone Number:
                <input type="text" id="phone" name="phone">
                </label>
            </div>

            <div class="password">
                <label for="pass-first">Password:
                <input type="text" id="pass-first" name="password">
                </label>

                <label for="pass-confirm">Confirm Password:
                <input type="text" id="pass-confirm" name="password">
                </label>
            </div>
            <div class="create">
                <button type="submit">Create Account</button>
                <!-- Create log-in page to for <a> tag link -->
                <p>Already have an account?<a href="../landingpage/index.html" target="_blank"> Log in</a></p>
            </div>
        </div>

    </form>


</body>
</html>

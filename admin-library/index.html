<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
<div class="container">
    <div class="header">
        <input type="text" placeholder="Title">
        <input type="text" placeholder="Author">
        <input type="number" placeholder="Pages">
        <select>
            <option>Read</option>
            <option>Reading</option>
            <option>Want to Read</option>
        </select>
        <button>Submit</button>
    </div>

    <div class="dashboard">
       <div class="dashboard-logo">
            <svg viewBox="0 0 24 24" style="height: 50px; width: 50px;">
            <path fill="currentColor" d="M13,3V9H21V3M13,21H21V11H13M3,21H11V15H3M3,13H11V3H3V13Z">
            </path>
            </svg> 
            <span>Dashboard</span>
       </div>

<!-- TODO: Add Icons to dashboard options -->
       <div class="dash-options">
            <div>Home</div>
            <div>Profile</div>
            <div>Messages</div>
            <div>History</div>
            <div>Tasks</div>
            <div>Communities</div>
       </div>

       <div class="dash-settings">
            <div>Settings</div>
            <div>Support</div>
            <div>Privacy</div>
       </div>
    </div>



</div>
</body>
</html>
